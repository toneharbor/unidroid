[package]
name = "unidroid"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "A low-memory unidbg: run Android arm64 and armv7 .so files on a computer, in Rust on Unicorn."
repository = "https://github.com/zhoupb01/unidroid"
readme = "README.md"
keywords = ["android", "emulator", "unicorn", "jni", "unidbg"]
categories = ["emulators", "development-tools"]
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/Cargo.toml"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
goblin = "0.10.7"
libc = "0.2.190"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_aarch64", "arch_arm"] }
